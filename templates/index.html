<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slack Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 2rem;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    label {
      font-size: 0.9rem;
      color: #555;
      display: block;
      margin-top: 1rem;
    }

    input, select, textarea {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .response {
      margin-top: 2rem;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 10px;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .slack-preview {
      margin-top: 1rem;
      padding: 1rem;
      background: #f1f5f9;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Slack Command Simulator</h1>

    <form id="form">
      <label>Command</label>
      <select name="command">
        <option value="/create-ticket">/create-ticket</option>
        <option value="/improve-ticket">/improve-ticket</option>
        <option value="/summarize-thread">/summarize-thread</option>
      </select>

      <label>User ID</label>
      <input name="user_id" value="U123456" />

      <label>Channel ID</label>
      <input name="channel_id" value="C123456" />

      <label>Response URL</label>
      <input name="response_url" placeholder="Enter response URL" value="https://127.0.0.1:8000/" />

      <label>Describe your issue</label>
      <textarea name="text" placeholder="e.g. I can't log in to the dashboard after resetting my password"></textarea>

      <button type="submit">Send to /slack/commands</button>
    </form>

    <div class="response" id="rawResponse"></div>
    <div class="slack-preview" id="preview"></div>
  </div>

  <script>
    const form = document.getElementById("form");
    const raw = document.getElementById("rawResponse");
    const preview = document.getElementById("preview");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      const res = await fetch("/slack/commands", {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      // Pretty JSON output
      raw.textContent = JSON.stringify(data, null, 2);

      // Slack-style preview
      if (data.text) {
        preview.style.display = "block";
        preview.innerHTML = `<strong>Slack Response:</strong><br>${data.text}`;
      } else {
        preview.style.display = "none";
      }
    });
  </script>
</body>
</html>
